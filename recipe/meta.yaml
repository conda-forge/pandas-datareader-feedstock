{% set version = "0.11.0" %}

package:
  name: pandas-datareader
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pandas-datareader/pandas_datareader-{{ version }}.tar.gz
  sha256: 6c86360127f0b4c4451495574e162da058cf6154a185503310df70c417e0e266

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  skip: true  # [py<310]
  
requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools_scm >=8.0.0,<9
    - wheel
  run:
    - python >=${{ python_min }}
    - lxml
    - pandas >=2.1.4
    - requests >=2.3.0

test:
  requires:
    - python {{ python_min }}
  imports:
    - pandas_datareader

about:
  home: https://github.com/pydata/pandas-datareader
  license: BSD-3-Clause
  license_file: LICENSE.md
  license_family: BSD
  summary: Up to date remote data access for pandas, works for multiple versions of pandas
  dev_url: https://github.com/pydata/pandas-datareader
  doc_url: https://pandas-datareader.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - timkpaine
    - mariusvniekerk
    - femtotrader
    - jreback
    - davidastephens
    - bashtage
